name: Build SMAPI mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Stardew Valley reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Generate pixel-art weapon texture
        run: |
          python3 -m pip install --user pillow
          mkdir -p assets
          python3 assets/generate_revolver.py

      - name: Build
        run: dotnet build StardewRevolver.csproj --configuration Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Stardew-Revolver-prototype
          path: |
            bin/Release/net6.0/
          if-no-files-found: error
